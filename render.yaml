services:
  - type: web
    name: cryptobyance-signal-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SCAN_INTERVAL_SECONDS
        value: "60"
      - key: CONCURRENCY
        value: "8"
      - key: TIMEFRAME
        value: 5m
      - key: CONTEXT_TIMEFRAME
        value: 15m
      - key: ADX_MIN
        value: "17"
      - key: SIGNAL_COOLDOWN_CANDLES
        value: "3"
