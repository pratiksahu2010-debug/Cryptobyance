services:
  - type: web
    name: cryptobyance-signal-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --loop asyncio --http h11
    healthCheckPath: /ping
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONFAULTHANDLER
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SCAN_INTERVAL_SECONDS
        value: "60"
      - key: CONCURRENCY
        value: "8"
      - key: TIMEFRAME
        value: 5m
      - key: CONTEXT_TIMEFRAME
        value: 15m
      - key: CONTEXT_RSI_MIDLINE
        value: "50"
      - key: ADX_MIN
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JOURNAL_API_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: SIGNAL_COOLDOWN_CANDLES
        value: "4"
      - key: DB_RETENTION_DAYS
        value: "365"
